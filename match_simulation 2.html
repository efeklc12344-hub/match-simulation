<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bouncing Balls Match Simulation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background-color:#0d2818;color:#fff;position:fixed;inset:0;width:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
.pitch-bg{background:radial-gradient(circle at center,#1b4d2e 0%,#0d2818 100%)}
.glass-panel{background:rgba(15,23,42,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);box-shadow:0 20px 50px rgba(0,0,0,.6);border-radius:1.5rem}
.modern-input{background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.2);font-family:'Inter',sans-serif;font-weight:600;padding:12px 16px;width:100%;outline:none;text-align:center;font-size:15px;border-radius:.875rem;transition:all .2s ease}
.modern-input:focus{border-color:#facc15;box-shadow:0 0 15px rgba(250,204,21,.3);background:rgba(0,0,0,.7)}
.modern-btn{background:linear-gradient(135deg,#facc15 0%,#eab308 100%);color:#0f172a;border:1px solid rgba(255,255,255,.3);font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:14px 20px;width:100%;cursor:pointer;font-family:inherit;font-size:13px;border-radius:.875rem;transition:all .15s ease}
.modern-btn:active{transform:translateY(1px)}
.modern-btn:disabled{opacity:.5;cursor:not-allowed}
.logo-box{width:58px;height:58px;flex:none;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:10px;font-weight:700;overflow:hidden;border-radius:50%}
.logo-box img{width:100%;height:100%;display:none}
#simCanvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#0d2818}
</style>
</head>
<body class="pitch-bg">

<div id="setup-screen" class="absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-md overflow-y-auto">
<div class="min-h-full flex items-center justify-center p-4">
<div class="glass-panel p-6 sm:p-8 w-full max-w-lg">
<div class="text-center mb-6">
<span class="inline-block px-3 py-1 bg-yellow-400/10 text-yellow-400 text-[10px] font-extrabold uppercase tracking-widest rounded-full mb-2 border border-yellow-400/20">Optimized Match Simulator</span>
<h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">GAME SETUP</h1>
</div>
<div class="space-y-5">
<div class="bg-blue-950/30 p-4 rounded-2xl border border-blue-500/30">
<label class="block text-xs font-bold text-blue-400 mb-2 text-center uppercase tracking-wider">Blue Ball (Team 1)</label>
<input type="text" id="t1-name" value="Home Team" class="modern-input" maxlength="15">
<div class="flex items-center gap-3 mt-3">
<div class="logo-box"><span id="t1-logo-ph">LOGO</span><img id="t1-logo-img" alt="Team 1 Logo"></div>
<div class="flex-1 flex flex-col gap-2">
<label class="modern-btn py-2 text-xs text-center block cursor-pointer">SELECT LOGO<input type="file" accept="image/*" class="hidden" onchange="loadLogo(1,this)"></label>
<button type="button" id="t1-fit-btn" onclick="toggleLogoFit(1)" class="modern-btn hidden py-1.5 text-[10px] bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-white/20">FIT: COVER</button>
</div>
<button type="button" id="t1-logo-del" onclick="removeLogo(1)" class="modern-btn hidden w-11 px-0 font-bold" style="background:#ef4444;color:#fff;">✕</button>
</div>
</div>
<div class="bg-red-950/30 p-4 rounded-2xl border border-red-500/30">
<label class="block text-xs font-bold text-red-400 mb-2 text-center uppercase tracking-wider">Red Ball (Team 2)</label>
<input type="text" id="t2-name" value="Away Team" class="modern-input" maxlength="15">
<div class="flex items-center gap-3 mt-3">
<div class="logo-box"><span id="t2-logo-ph">LOGO</span><img id="t2-logo-img" alt="Team 2 Logo"></div>
<div class="flex-1 flex flex-col gap-2">
<label class="modern-btn py-2 text-xs text-center block cursor-pointer">SELECT LOGO<input type="file" accept="image/*" class="hidden" onchange="loadLogo(2,this)"></label>
<button type="button" id="t2-fit-btn" onclick="toggleLogoFit(2)" class="modern-btn hidden py-1.5 text-[10px] bg-gradient-to-r from-blue-600 to-indigo-600 text-white border-white/20">FIT: COVER</button>
</div>
<button type="button" id="t2-logo-del" onclick="removeLogo(2)" class="modern-btn hidden w-11 px-0 font-bold" style="background:#ef4444;color:#fff;">✕</button>
</div>
</div>
<div class="text-[11px] text-gray-300 text-center leading-relaxed border border-white/10 p-3.5 rounded-xl bg-slate-900/50">
<span class="font-bold text-yellow-400">Rule:</span> A rotating <span class="text-yellow-300 font-semibold">REALISTIC GOAL</span> spins around the arena. The ball exiting through the net within 90 minutes (35 real seconds) scores a point! The goal stays closed for the first 1.5 seconds of each kickoff.
</div>
<button onclick="startGame()" class="modern-btn text-sm py-4">START SIMULATION</button>
</div>
</div>
</div>
</div>

<canvas id="simCanvas"></canvas>

<div id="game-ui" class="hidden">
<div id="end-screen" class="hidden absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-md overflow-y-auto">
<div class="min-h-full flex items-center justify-center p-3 sm:p-6">
<div class="glass-panel p-5 sm:p-7 w-full max-w-lg text-center">
<h1 class="text-2xl sm:text-3xl font-black text-yellow-400 mb-4 tracking-tight">MATCH FINISHED</h1>
<div class="bg-slate-900/80 rounded-2xl border border-white/15 p-5 mb-5 shadow-inner">
<div class="flex items-center justify-between gap-3">
<div class="flex-1 flex flex-col items-center">
<div class="w-14 h-14 rounded-full border-2 border-blue-400 bg-slate-950 flex items-center justify-center overflow-hidden mb-2 shadow-md">
<img id="end-t1-logo" class="w-full h-full object-cover hidden" alt=""><span id="end-t1-ph" class="text-xs font-bold text-blue-400">T1</span>
</div>
<span id="final-t1-name" class="text-xs font-extrabold text-blue-400 truncate max-w-[110px]"></span>
</div>
<div class="text-center px-2">
<div class="text-3xl sm:text-4xl font-black text-white tracking-wider" id="final-score-display">0 - 0</div>
<div class="text-[10px] font-extrabold text-yellow-400 uppercase tracking-widest mt-1">FINAL SCORE</div>
</div>
<div class="flex-1 flex flex-col items-center">
<div class="w-14 h-14 rounded-full border-2 border-red-400 bg-slate-950 flex items-center justify-center overflow-hidden mb-2 shadow-md">
<img id="end-t2-logo" class="w-full h-full object-cover hidden" alt=""><span id="end-t2-ph" class="text-xs font-bold text-red-400">T2</span>
</div>
<span id="final-t2-name" class="text-xs font-extrabold text-red-400 truncate max-w-[110px]"></span>
</div>
</div>
</div>
<div class="flex flex-col sm:flex-row gap-3">
<button onclick="playAgain()" class="modern-btn flex-1">PLAY AGAIN</button>
<button onclick="goToSetup()" class="modern-btn flex-1" style="background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);color:white;">EDIT TEAMS</button>
<button id="download-btn" onclick="saveRecording()" class="modern-btn flex-1 hidden" style="background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);color:white;">DOWNLOAD VIDEO</button>
</div>
</div>
</div>
</div>
</div>

let goalBuf = null;
let audioCtx = null, masterGain = null, audioDest = null, noiseBuf = null;
function initAudio() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.9;
            masterGain.connect(audioCtx.destination);
            if (audioCtx.createMediaStreamDestination) {
                audioDest = audioCtx.createMediaStreamDestination();
                masterGain.connect(audioDest);
            }
            const len = audioCtx.sampleRate * 2;
            noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
            try {
                const bin = atob(GOAL_SHOUT_B64), u8 = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                audioCtx.decodeAudioData(u8.buffer, b => { goalBuf = b; }, () => {});
            } catch (e) {}
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
}
window.addEventListener('click', initAudio);
window.addEventListener('touchstart', initAudio);

function playSound(type) {
    try {
        initAudio();
        if (!audioCtx || audioCtx.state !== 'running') return;
        const now = audioCtx.currentTime, out = masterGain;

        const tone = (wave, f, peak, dur, delay = 0, attack = .005) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = now + delay;
            o.type = wave; o.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(.0001, t);
            g.gain.linearRampToValueAtTime(peak, t + attack);
            g.gain.exponentialRampToValueAtTime(.0001, t + dur);
            o.connect(g); g.connect(out);
            o.start(t); o.stop(t + dur + .02);
            return o;
        };
        const noise = (freq, q, peak, dur, delay = 0, attack = .005) => {
            const sr = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain(), t = now + delay;
            sr.buffer = noiseBuf; sr.loop = true;
            f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
            g.gain.setValueAtTime(.0001, t);
            g.gain.linearRampToValueAtTime(peak, t + attack);
            g.gain.exponentialRampToValueAtTime(.0001, t + dur);
            sr.connect(f); f.connect(g); g.connect(out);
            sr.start(t); sr.stop(t + dur + .02);
        };
        const whistle = (delay, dur, freq) => {
            const t = now + delay;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain(), lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
            lfo.frequency.value = 32; lg.gain.value = 90;
            lfo.connect(lg); lg.connect(o.frequency);
            o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(.0001, t);
            g.gain.linearRampToValueAtTime(.4, t + .03);
            g.gain.setValueAtTime(.4, t + Math.max(.04, dur - .06));
            g.gain.exponentialRampToValueAtTime(.0001, t + dur);
            o.connect(g); g.connect(out);
            lfo.start(t); o.start(t); lfo.stop(t + dur + .02); o.stop(t + dur + .02);
            noise(freq, 8, .12, dur, delay, .03);
        };

        // crowd shouting "GOOOL": formant-synthesised voices (g -> o -> l), no noise bed
        const shout = () => {
            const comp = audioCtx.createDynamicsCompressor(), mk = audioCtx.createGain();
            mk.gain.value = 2;
            comp.connect(mk); mk.connect(out);
            noise(1500, 1, .12, .03);
            const dur = 1.7;
            for (let i = 0; i < 7; i++) {
                const t = now + Math.random() * .08, f0 = 105 + Math.random() * 110;
                const o = audioCtx.createOscillator(), vg = audioCtx.createGain();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(f0 * .9, t);
                o.frequency.linearRampToValueAtTime(f0 * 1.15, t + .15);
                o.frequency.setValueAtTime(f0 * 1.12, t + 1.0);
                o.frequency.linearRampToValueAtTime(f0 * .85, t + dur);
                vg.gain.setValueAtTime(.0001, t);
                vg.gain.linearRampToValueAtTime(.55, t + .06);
                vg.gain.setValueAtTime(.55, t + 1.05);
                vg.gain.exponentialRampToValueAtTime(.0001, t + dur);
                o.connect(vg);
                [[300, 520, 380, 5, 1], [1800, 900, 1200, 6, .7], [2800, 2800, 2600, 8, .25]].forEach(([f1, f2, f3, q, gv]) => {
                    const bp = audioCtx.createBiquadFilter(), gn = audioCtx.createGain();
                    bp.type = 'bandpass'; bp.Q.value = q;
                    bp.frequency.setValueAtTime(f1, t);
                    bp.frequency.linearRampToValueAtTime(f2, t + .12);
                    bp.frequency.setValueAtTime(f2, t + 1.0);
                    bp.frequency.linearRampToValueAtTime(f3, t + 1.3);
                    gn.gain.value = gv;
                    vg.connect(bp); bp.connect(gn); gn.connect(comp);
                });
                o.start(t); o.stop(t + dur + .05);
            }
        };

        if (type === 'bounce') {
            const o = tone('sine', 360, .15, .06);
            o.frequency.exponentialRampToValueAtTime(180, now + .06);
        } else if (type === 'post') {
            // ball thud + steel tube ring (free-bar overtones) + sharp metal click
            const th = tone('sine', 140, .6, .14);
            th.frequency.exponentialRampToValueAtTime(55, now + .14);
            noise(1800, .7, .4, .05);
            noise(6000, 1, .15, .02);
            const base = 500 + Math.random() * 60;
            [[1, .32, 1.5], [2.756, .2, 1.0], [5.404, .1, .55], [8.933, .05, .3]].forEach(([r, pk, d]) => tone('sine', base * r, pk, d, 0, .002));
        } else if (type === 'card') {
            const o = tone('triangle', 520, .18, .15);
            o.frequency.setValueAtTime(650, now + .08);
        } else if (type === 'goal') {
            if (goalBuf) {
                const gs = audioCtx.createBufferSource();
                gs.buffer = goalBuf;
                gs.connect(out);
                gs.start(now);
            } else shout();
        } else if (type === 'start') {
            whistle(0, 1.0, 2400);
        } else if (type === 'whistle') {
            whistle(0, .35, 2400);
            whistle(.45, .35, 2400);
            whistle(.9, 1.0, 2350);
        }
    } catch (e) {}
}

// --- POST EFFECTS ---
let postEffects = [];
function spawnPostSparks(x, y, angle) {
    postEffects.push({ type: 'ring', x, y, radius: 8, maxRadius: 55, life: 1 });
    for (let i = 0; i < 12; i++) {
        const a = angle + (Math.random() - .5) * 1.8, sp = 4 + Math.random() * 9;
        postEffects.push({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, radius: 3 + Math.random() * 4, color: Math.random() < .6 ? '#facc15' : '#ffffff', life: 1 });
    }
}
function updateAndDrawEffects() {
    for (let i = postEffects.length - 1; i >= 0; i--) {
        const e = postEffects[i];
        e.life -= .05;
        if (e.life <= 0) { postEffects.splice(i, 1); continue; }
        if (e.type === 'ring') {
            e.radius += (e.maxRadius - e.radius) * .2;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(250,204,21,${e.life})`;
            ctx.lineWidth = 5 * e.life;
            ctx.stroke();
        } else {
            e.x += e.vx; e.y += e.vy;
            ctx.beginPath();
            ctx.arc(e.x, e.y, Math.max(1, e.radius * e.life), 0, Math.PI * 2);
            ctx.fillStyle = e.color;
            ctx.globalAlpha = e.life;
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

class Card {
    constructor() {
        const r = Math.sqrt(Math.random()) * (arenaRadius * .75), th = Math.random() * Math.PI * 2;
        this.x = arenaCenter.x + r * Math.cos(th);
        this.y = arenaCenter.y + r * Math.sin(th);
        this.type = Math.random() < .85 ? 'yellow' : 'red';
        this.radius = 10;
        this.timeLeft = 1800;
    }
    draw() {
        drawRoundRectPath(this.x - 6, this.y - 8, 12, 16, 2);
        ctx.fillStyle = this.type === 'yellow' ? '#facc15' : '#ef4444';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

class Ball {
    constructor(x, y, color, teamIndex) {
        this.x = x; this.y = y;
        this.color = color;
        this.teamIndex = teamIndex;
        this.baseRadius = BALL_RADIUS;
        this.sprite = null;
        this.updateRadius();
        const a = Math.random() * Math.PI * 2;
        this.vx = Math.cos(a) * BALL_SPEED;
        this.vy = Math.sin(a) * BALL_SPEED;
    }
    updateRadius() {
        this.radius = this.baseRadius + teamCards[this.teamIndex].red * 5;
        this.sprite = null;
    }
    buildSprite() {
        const r = this.radius, size = Math.ceil((r + 3) * 2), m = size / 2;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        g.beginPath(); g.arc(m, m, r, 0, Math.PI * 2);
        g.fillStyle = this.color; g.fill();
        const logo = teamLogos[this.teamIndex];
        if (logo) {
            const ir = r - 3;
            g.save();
            g.beginPath(); g.arc(m, m, ir, 0, Math.PI * 2); g.clip();
            g.drawImage(logo, m - ir, m - ir, ir * 2, ir * 2);
            g.restore();
        }
        g.beginPath(); g.arc(m, m, r, 0, Math.PI * 2);
        g.strokeStyle = '#fff'; g.lineWidth = 2.5; g.stroke();
        this.sprite = c;
        this.half = m;
    }
    draw() {
        if (!this.sprite) this.buildSprite();
        ctx.drawImage(this.sprite, this.x - this.half, this.y - this.half);
    }
    update() { this.x += this.vx; this.y += this.vy; }
    normalizeSpeed() {
        const mag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (mag > 0) { this.vx = this.vx / mag * BALL_SPEED; this.vy = this.vy / mag * BALL_SPEED; }
    }
    jitter(intensity = .45) {
        const a = (Math.random() - .5) * intensity, cos = Math.cos(a), sin = Math.sin(a);
        const nx = this.vx * cos - this.vy * sin, ny = this.vx * sin + this.vy * cos;
        this.vx = nx; this.vy = ny;
        this.normalizeSpeed();
    }
}

// Goal + arena ring pre-rendered once (angle 0), then rotated each frame
function buildGoalSprite() {
    const R = arenaRadius, D = NET_DEPTH, A = GOAL_ANGLE;
    goalHalf = Math.ceil(R + D + 30);
    goalSprite = document.createElement('canvas');
    goalSprite.width = goalSprite.height = goalHalf * 2;
    const g = goalSprite.getContext('2d'), c = goalHalf;
    const P = (a, r) => [c + Math.cos(a) * r, c + Math.sin(a) * r];

    g.lineWidth = 6; g.strokeStyle = '#fff';
    g.beginPath(); g.arc(c, c, R, A, Math.PI * 2 - A); g.stroke();

    g.beginPath(); g.arc(c, c, R, -A, A); g.arc(c, c, R + D, A, -A, true); g.closePath();
    g.fillStyle = 'rgba(0,0,0,0.4)'; g.fill();

    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1.5;
    for (let o = 10; o <= D; o += 10) { g.beginPath(); g.arc(c, c, R + o, -A, A); g.stroke(); }
    for (let i = 0; i <= 8; i++) {
        const a = -A + 2 * A * i / 8, [x1, y1] = P(a, R), [x2, y2] = P(a, R + D);
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }

    g.beginPath(); g.arc(c, c, R + D, -A, A);
    g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 3; g.stroke();

    const [p1x, p1y] = P(-A, R), [p2x, p2y] = P(A, R), [b1x, b1y] = P(-A, R + D), [b2x, b2y] = P(A, R + D);
    g.beginPath(); g.moveTo(p1x, p1y); g.lineTo(b1x, b1y); g.moveTo(p2x, p2y); g.lineTo(b2x, b2y); g.stroke();

    g.beginPath(); g.arc(c, c, R, -A, A);
    g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 3;
    g.setLineDash([8, 6]); g.stroke(); g.setLineDash([]);

    drawGoalPost(g, p1x, p1y);
    drawGoalPost(g, p2x, p2y);
}

function drawArena() {

}

function drawRoundRectPath(x, y, w, h, r = 10) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function fontStr(size, weight = '700') { return `${weight} ${Math.round(size)}px 'Inter', system-ui, sans-serif`; }
function drawText(text, x, y, size, color, align = 'center', weight = '700') {
    ctx.font = fontStr(size, weight);
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
}
function drawFitted(text, x, y, maxSize, maxWidth, color, weight = '700') {
    let s = maxSize;
    ctx.font = fontStr(s, weight);
    while (s > 10 && ctx.measureText(text).width > maxWidth) { s -= 1; ctx.font = fontStr(s, weight); }
    let t = text;
    while (t.length > 1 && ctx.measureText(t).width > maxWidth) t = t.slice(0, -1);
    if (t !== text) t = t.slice(0, -1) + '…';
    drawText(t, x, y, s, color, 'center', weight);
}
function drawModernPanel(x, y, w, h, radius = 20, alpha = .85) {

function checkCollisions() {
    if (goalTimer > 0 || isMatchOver || isIntro) return;

    for (let bi = 0; bi < 2; bi++) {
        const ball = balls[bi];
        for (let i = activeCards.length - 1; i >= 0; i--) {
            const card = activeCards[i];
            const dx = ball.x - card.x, dy = ball.y - card.y, rr = ball.radius + card.radius;
            if (dx * dx + dy * dy < rr * rr) {
                playSound('card');
                const tc = teamCards[ball.teamIndex];
                if (card.type === 'yellow') {
                    tc.yellow++;
                    if (tc.yellow >= 2) { tc.yellow -= 2; tc.red++; ball.updateRadius(); }
                } else {
                    tc.red++;
                    ball.updateRadius();
                }
                activeCards.splice(i, 1);
            }
        }
    }

    const b1 = balls[0], b2 = balls[1];
    const dx = b2.x - b1.x, dy = b2.y - b1.y;
    const distance = Math.sqrt(dx * dx + dy * dy) || .001;
    const minDist = b1.radius + b2.radius;
    if (distance < minDist) {
        playSound('bounce');
        const overlap = minDist - distance, nx = dx / distance, ny = dy / distance;
        b1.x -= nx * overlap / 2; b1.y -= ny * overlap / 2;
        b2.x += nx * overlap / 2; b2.y += ny * overlap / 2;
        const v1n = b1.vx * nx + b1.vy * ny, v2n = b2.vx * nx + b2.vy * ny;
        const v1t = b1.vx * -ny + b1.vy * nx, v2t = b2.vx * -ny + b2.vy * nx;
        b1.vx = v2n * nx + v1t * -ny; b1.vy = v2n * ny + v1t * nx;
        b2.vx = v1n * nx + v2t * -ny; b2.vy = v1n * ny + v2t * nx;
        b1.jitter(.6); b2.jitter(.6);
    }

    const goalOpen = graceTimer <= 0;
    for (let bi = 0; bi < 2; bi++) {
        const ball = balls[bi];
        const ox = ball.x - arenaCenter.x, oy = ball.y - arenaCenter.y;
        const d = Math.sqrt(ox * ox + oy * oy);
        if (d + ball.radius <= arenaRadius) continue;

        const angle = Math.atan2(oy, ox);
        let diff = angle - goalRotation;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;

        if (goalOpen && Math.abs(diff) < GOAL_ANGLE) {
            if (d - ball.radius > arenaRadius) handleGoal(ball.teamIndex);
        } else {
            const overlap = d + ball.radius - arenaRadius, nx = ox / d, ny = oy / d;
            ball.x -= nx * overlap; ball.y -= ny * overlap;
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny;
            ball.jitter(.5);
            if (Math.abs(Math.abs(diff) - GOAL_ANGLE) < .22) {
                playSound('post');
                spawnPostSparks(ball.x, ball.y, angle);
            } else {
                playSound('bounce');
            }
        }
    }
}

function handleGoal(teamIndex) {
    if (goalTimer > 0 || isMatchOver || isIntro || graceTimer > 0) return;
    goalTimer = 600;
    playSound('goal');
    if (teamIndex === 1) { score1++; goalScorerName = t1Name; }
    else { score2++; goalScorerName = t2Name; }
}

function draw() {
    ctx.drawImage(pitchCache, 0, 0);
    for (let i = 0; i < activeCards.length; i++) activeCards[i].draw();
    drawArena();
    for (let i = 0; i < balls.length; i++) balls[i].draw();
    updateAndDrawEffects();
    drawScoreboardCached();
    if (isIntro) drawIntroOverlay();
    if (goalTimer > 0) drawGoalOverlay();
    if (isMatchOver) drawEndOverlay();
}

function pickMime() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    return ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}
function setDownloadState(state) {
    if (state === 'none') { dlBtn.classList.add('hidden'); return; }
    dlBtn.classList.remove('hidden');
    if (state === 'pending') {
        dlBtn.disabled = true;
        dlBtn.textContent = 'PREPARING VIDEO...';
    } else {
        dlBtn.disabled = false;
        let canShare = false;
        try { canShare = isTouch && videoFile && navigator.canShare && navigator.canShare({ files: [videoFile] }); } catch (e) {}
        dlBtn.textContent = canShare ? 'SAVE / SHARE VIDEO' : 'DOWNLOAD VIDEO';
    }
}
function releaseVideo() {
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = null; videoBlob = null; videoFile = null;
}
function discardRecording() {
    if (!rec) return;
    const r = rec;
    r.discarded = true;
    rec = null;
    try { if (r.recorder.state !== 'inactive') r.recorder.stop(); } catch (e) {}
    try { r.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
}
function startRecording() {
    discardRecording();
    releaseVideo();
    setDownloadState('none');
    if (!window.MediaRecorder || !canvas.captureStream) return;
    try {
        const stream = canvas.captureStream(TARGET_FPS), mime = pickMime();
        if (audioDest) audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t.clone()));
        let recorder;
        try {
            const opts = { videoBitsPerSecond: 25000000 };
            if (mime) opts.mimeType = mime;
            recorder = new MediaRecorder(stream, opts);
        } catch (e) { recorder = new MediaRecorder(stream); }
        const r = { recorder, stream, chunks: [], discarded: false, mime };
        recorder.ondataavailable = e => { if (e.data && e.data.size > 0) r.chunks.push(e.data); };
        recorder.onstop = () => {
            try { r.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
            if (r.discarded || rec !== r) return;
            buildVideo(r);
        };
        recorder.start(1000);
        rec = r;
    } catch (e) { rec = null; }
}
function buildVideo(r) {
    const type = ((r.recorder && r.recorder.mimeType) || r.mime || 'video/webm').split(';')[0];
    const blob = new Blob(r.chunks, { type });
    if (!blob.size) { setDownloadState('none'); return; }
    const ext = type.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
    const safe = s => (s || '').trim().replace(/[^\p{L}\p{N}]+/gu, '_') || 'team';
    videoBlob = blob;
    videoUrl = URL.createObjectURL(blob);
    videoName = `match_120fps_${safe(t1Name)}_vs_${safe(t2Name)}.${ext}`;
    try { videoFile = new File([blob], videoName, { type }); } catch (e) { videoFile = null; }
    setDownloadState('ready');
}
function finishRecording() {
    if (!rec) { setDownloadState('none'); return; }
    try { if (rec.recorder.state !== 'inactive') rec.recorder.stop(); }
    catch (e) { setDownloadState('none'); }
}
async function saveRecording() {
    if (!videoBlob) return;
    if (isTouch && videoFile && navigator.canShare && navigator.canShare({ files: [videoFile] })) {
        try { await navigator.share({ files: [videoFile] }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = videoUrl; a.download = videoName;
    document.body.appendChild(a); a.click(); a.remove();
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (rec && rec.recorder.state === 'recording') { try { rec.recorder.pause(); } catch (e) {} }
    } else {
        lastTime = 0; acc = 0;
        if (rec && rec.recorder.state === 'paused') { try { rec.recorder.resume(); } catch (e) {} }
        requestWakeLock();
    }
});

let wakeLock = null;
async function requestWakeLock() {
    try { if (running && 'wakeLock' in navigator && !document.hidden) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
}

function step() {
    if (isMatchOver) return;
    if (isIntro) {
        introTimer -= STEP;
        if (introTimer <= 0) { isIntro = false; introTimer = 0; playSound('start'); }
        return;
    }
    if (goalTimer > 0) {
        goalTimer -= STEP;
        if (goalTimer <= 0) { goalTimer = 0; resetBalls(); }
        return;
    }

    matchMinutes += STEP * MINS_PER_MS;
    if (graceTimer > 0) graceTimer -= STEP;

    cardSpawnTimer += STEP;
    if (cardSpawnTimer > nextCardSpawnInterval) {
        cardSpawnTimer = 0;
        nextCardSpawnInterval = 12000 + Math.random() * 6000;
        if (activeCards.length < 4) activeCards.push(new Card());
    }
    for (let i = activeCards.length - 1; i >= 0; i--) {
        activeCards[i].timeLeft -= STEP;
        if (activeCards[i].timeLeft <= 0) activeCards.splice(i, 1);
    }

    if (matchMinutes >= 90) { matchMinutes = 90; endMatch(); return; }

    goalRotation = (goalRotation + GOAL_ROTATION_SPEED) % (Math.PI * 2);
    balls[0].update(); balls[1].update();
    checkCollisions();
}

function loop(ts) {
    if (!running) return;
    rafId = requestAnimationFrame(loop);
    if (!lastTime) lastTime = ts;
    let dt = ts - lastTime;
    lastTime = ts;
    if (dt < 0) dt = 0;
    if (dt > 100) dt = 100;

    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; }
    if (n >= 6) acc = 0;

    draw();

    if (isMatchOver) {
        endTimer -= dt;
        if (endTimer <= 0) {
            running = false;
            cancelAnimationFrame(rafId);
            releaseWakeLock();
            finishRecording();
        }
    }
}
</script>
